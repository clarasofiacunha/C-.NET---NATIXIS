name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-csharp:
    name: CodeQL (C#)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: personal-finance-app/global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual

      - name: Build backend
        working-directory: personal-finance-app
        run: dotnet build PersonalFinance.slnx --configuration Release

      - name: Analyze C#
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  codeql-javascript:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze JavaScript/TypeScript
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
